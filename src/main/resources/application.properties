spring.application.name=fire-monitoring-system
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# Supply a private value with at least 32 UTF-8 bytes through FIRE_JWT_SECRET.
security.jwt.secret=${FIRE_JWT_SECRET:}
security.jwt.issuer=${FIRE_JWT_ISSUER:fire-monitoring-system}
security.jwt.expiration-minutes=${FIRE_JWT_EXPIRATION_MINUTES:60}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fire_monitoring}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Enable after supplying the MQTT broker connection details.
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:fire-monitoring-be-${random.uuid}}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic=${MQTT_TOPIC:fire-monitor/kits/+/telemetry}
mqtt.qos=${MQTT_QOS:1}
mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
mqtt.keep-alive-seconds=${MQTT_KEEP_ALIVE_SECONDS:60}

prediction.base-url=${PREDICTION_BASE_URL:http://localhost:8000}
