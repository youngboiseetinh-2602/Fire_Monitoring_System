services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    user: "0:0"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-fire_monitor}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-fire_monitor_local_password}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /mosquitto/data/password_file ]; then
          chown root:root /mosquitto/data/password_file
          chmod 0600 /mosquitto/data/password_file
          mosquitto_passwd -b /mosquitto/data/password_file "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        else
          mosquitto_passwd -b -c /mosquitto/data/password_file "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        fi
        chown mosquitto:mosquitto /mosquitto/data/password_file
        chmod 0600 /mosquitto/data/password_file
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fire-monitoring

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fire_monitoring}
      MYSQL_USER: ${MYSQL_USER:-fire_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fire_monitor_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fire-monitoring

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-fire_monitoring}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
      DB_USERNAME: ${MYSQL_USER:-fire_monitor}
      DB_PASSWORD: ${MYSQL_PASSWORD:-fire_monitor_password}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      FIRE_JWT_SECRET: ${FIRE_JWT_SECRET:-change-this-local-development-secret-32-bytes}
      FIRE_JWT_ISSUER: ${FIRE_JWT_ISSUER:-fire-monitoring-system}
      FIRE_JWT_EXPIRATION_MINUTES: ${FIRE_JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-fire-monitoring-docker}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - fire-monitoring

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - fire-monitoring

volumes:
  mysql_data:
  mosquitto_data:

networks:
  fire-monitoring:
    driver: bridge
